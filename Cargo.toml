[workspace]
members = ["crates/domain", "crates/server", "crates/app"]
default-members = ["crates/domain", "crates/server"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
meal-domain = { path = "crates/domain" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.android-dev]
inherits = "dev"

[profile.server-dev]
inherits = "dev"

