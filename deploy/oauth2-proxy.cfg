provider = "oidc"
http_address = "0.0.0.0:4180"
upstreams = ["http://gateway:8080/"]
reverse_proxy = true
trusted_proxy_ips = ["172.30.0.2/32"]
pass_user_headers = true
prefer_email_to_user = false
pass_basic_auth = false
pass_access_token = false
pass_authorization_header = false
skip_auth_strip_headers = true
code_challenge_method = "S256"
insecure_oidc_skip_nonce = false
scope = "openid email profile"
cookie_name = "__Host-deccan_session"
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_expire = "8h"
cookie_refresh = "1h"
cookie_csrf_per_request = true
cookie_csrf_per_request_limit = 5
api_routes = ["^/api/"]
request_logging = false
standard_logging = true
# Identity events belong in the identity provider's audit log, not app access logs.
auth_logging = false
