name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: meal_test
          POSTGRES_PASSWORD: integration_test_only
          POSTGRES_DB: meal_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U meal_test -d meal_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://meal_test:integration_test_only@127.0.0.1:5432/meal_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          rustup default 1.96.0
      - name: Unit, database and lint checks
        run: |
          ./scripts/check.sh
          cargo clippy -p meal-domain -p meal-server --all-targets --locked -- -D warnings
      - name: Build web client
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen
          ./scripts/install-dioxus.sh
          work/tools/dx build --platform web -p meal-app --release --debug-symbols false --locked
      - name: Browser checks
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          mkdir -p outputs
          cargo run -p meal-server --locked > outputs/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8081/api/ready > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8081/api/ready
          npm run test:browser
          MEAL_REQUIRE_AUTH=true work/tools/dx build --platform web -p meal-app --release --debug-symbols false --locked
          node scripts/account-ui-check.cjs
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --tag deccan-table:ci .
      - name: Validate gateway configuration
        run: docker run --rm -e PUBLIC_HOST=meals.example.com -e TLS_EMAIL=admin@example.com -e PROXY_AUTH_SECRET=ci-only-abcdefghijklmnopqrstuvwxyz0123456789 -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11.4 caddy validate --config /etc/caddy/Caddyfile
